name: Build + Release Public Free (Windows)

on:
  push:
    tags:
      - "free/v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MultiPingMonitor.sln

      - name: Test Sponsor Pro defaults
        run: dotnet test MultiPingMonitor.sln -c Release --no-restore -m:1

      - name: Test Public Free edition
        run: dotnet test MultiPingMonitor.sln -c Release --no-restore -m:1 -p:MultiPingMonitorEdition=PublicFree

      - name: Publish (win-x64)
        run: dotnet publish MultiPingMonitor/MultiPingMonitor.csproj -c Release -r win-x64 --self-contained true -p:MultiPingMonitorEdition=PublicFree -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify and package the single executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "MultiPingMonitor.exe") {
            throw "Expected exactly one published file: MultiPingMonitor.exe"
          }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($files[0].FullName).FileVersion
          if ($version -ne "1.0.0.0") {
            throw "Unexpected Public Free file version: $version"
          }
          Compress-Archive -LiteralPath $files[0].FullName -DestinationPath MultiPingMonitor-Free.zip -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MultiPingMonitor Public Free ${{ github.ref_name }}
          files: MultiPingMonitor-Free.zip
          generate_release_notes: true
